# Legacy azd reference only. Terraform workflows are the deployment source of truth.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: jfrog-agent-mykp
metadata:
    template: azd-init@1.34.1
services:
    existing-project:
        host: azure.ai.project
        endpoint: https://kaiser-foundry-resource.services.ai.azure.com/api/projects/mysecond-project-for-kp
    mykp-hosted-agent:
        host: azure.ai.agent
        uses:
            - existing-project
        kind: hosted
        name: mykp-hosted-agent
        image: "trialndswdc.jfrog.io/byor-demo-docker/agent-mykp:latest"
        docker:
            imagePassthrough: true
        registryConnectionId: jfrog-registry
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
        protocols:
            - protocol: responses
              version: "2.0.0"